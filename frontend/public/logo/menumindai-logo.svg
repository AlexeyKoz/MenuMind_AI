<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="menuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ABC9C;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="#ffffff"/>

  <g id="icon" transform="translate(20, 20)">
    <!-- Outer circle -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#menuGradient)" stroke-width="3" opacity="0.8"/>

    <!-- Shopping cart (left) -->
    <rect x="16" y="38" width="12" height="10" rx="1" fill="none" stroke="#9B59B6" stroke-width="2"/>
    <circle cx="19" cy="51" r="1.5" fill="#9B59B6"/>
    <circle cx="25" cy="51" r="1.5" fill="#9B59B6"/>
    <line x1="18" y1="35" x2="20" y2="38" stroke="#9B59B6" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="22" y2="38" stroke="#9B59B6" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Chef hat (right) - classic style with 3 puffs -->
    <!-- Bottom band -->
    <ellipse cx="60" cy="47" rx="7" ry="2" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <!-- Left puff -->
    <circle cx="55" cy="39" r="4" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <!-- Center puff -->
    <circle cx="60" cy="37" r="4.5" fill="none" stroke="#1ABC9C" stroke-width="2"/>
    <!-- Right puff -->
    <circle cx="65" cy="39" r="4" fill="none" stroke="#1ABC9C" stroke-width="2"/>

    <!-- Central menu/document icon -->
    <rect x="33" y="32" width="14" height="18" rx="1" fill="none" stroke="#3498DB" stroke-width="2"/>
    <line x1="36" y1="37" x2="44" y2="37" stroke="#3498DB" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="41" x2="44" y2="41" stroke="#3498DB" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="45" x2="44" y2="45" stroke="#3498DB" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Neural network nodes -->
    <circle cx="40" cy="28" r="2" fill="#3498DB" opacity="0.7"/>
    <circle cx="40" cy="52" r="2" fill="#3498DB" opacity="0.7"/>

    <!-- Connection lines to center -->
    <line x1="28" y1="43" x2="33" y2="41" stroke="#9B59B6" stroke-width="1" opacity="0.3"/>
    <line x1="53" y1="44" x2="47" y2="42" stroke="#1ABC9C" stroke-width="1" opacity="0.3"/>

    <!-- AI data flow particles -->
    <circle cx="40" cy="60" r="2" fill="#3498DB"/>
    <circle cx="32" cy="63" r="1.5" fill="#9B59B6" opacity="0.6"/>
    <circle cx="48" cy="63" r="1.5" fill="#1ABC9C" opacity="0.6"/>
    <circle cx="36" cy="67" r="1" fill="#3498DB" opacity="0.4"/>
    <circle cx="44" cy="67" r="1" fill="#3498DB" opacity="0.4"/>

  </g>

  <g id="text" transform="translate(120, 35)">
    <text x="0" y="25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#2C3E50">
      MenuMind
    </text>
    <text x="235" y="25" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="300" fill="#3498DB">
      AI
    </text>

    <text x="0" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#7F8C8D">
      Smart Cooking Solution
    </text>

    <rect x="220" y="58" width="40" height="20" rx="10" fill="#3498DB" opacity="0.9"/>
    <text x="240" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="white" text-anchor="middle">
      BETA
    </text>
  </g>

  <rect x="120" y="90" width="240" height="2" fill="url(#menuGradient)" opacity="0.3"/>
</svg>