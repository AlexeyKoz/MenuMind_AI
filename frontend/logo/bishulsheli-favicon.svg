<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="menuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ABC9C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="#ffffff"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="url(#menuGradient)" stroke-width="2"/>

  <!-- Shopping cart -->
  <rect x="6" y="15" width="5" height="4" rx="0.5" fill="none" stroke="#9B59B6" stroke-width="1.2"/>
  <circle cx="7.5" cy="20" r="0.8" fill="#9B59B6"/>
  <circle cx="10" cy="20" r="0.8" fill="#9B59B6"/>

  <!-- Chef hat -->
  <ellipse cx="24" cy="19" rx="3" ry="0.8" fill="none" stroke="#1ABC9C" stroke-width="1.2"/>
  <circle cx="22" cy="15.5" r="1.8" fill="none" stroke="#1ABC9C" stroke-width="1.2"/>
  <circle cx="24" cy="14.5" r="2" fill="none" stroke="#1ABC9C" stroke-width="1.2"/>
  <circle cx="26" cy="15.5" r="1.8" fill="none" stroke="#1ABC9C" stroke-width="1.2"/>

  <!-- Menu/Recipe -->
  <rect x="13" y="13" width="6" height="7" rx="0.5" fill="none" stroke="#3498DB" stroke-width="1.2"/>
  <line x1="14.5" y1="15" x2="17.5" y2="15" stroke="#3498DB" stroke-width="0.8"/>
  <line x1="14.5" y1="17" x2="17.5" y2="17" stroke="#3498DB" stroke-width="0.8"/>
  <line x1="14.5" y1="19" x2="17.5" y2="19" stroke="#3498DB" stroke-width="0.8"/>

  <!-- Data particles -->
  <circle cx="16" cy="24" r="1" fill="#3498DB"/>
  <circle cx="13" cy="25" r="0.7" fill="#9B59B6" opacity="0.6"/>
  <circle cx="19" cy="25" r="0.7" fill="#1ABC9C" opacity="0.6"/>
</svg>